<div class="component">
  <ng-container *ngIf="userType === Role.GUEST">
    <a routerLink="notifications">
      <i class="fa fa-bell" aria-hidden="true"></i>
    </a>
    <a routerLink="reservations">Reservations</a>
    <a routerLink="account">Account</a>
    <a (click)="logout()">Log out</a>
  </ng-container>

  <ng-container *ngIf="userType === Role.HOST">
    <a
      routerLink="create_accommodation"
      style="font-size: larger; font-weight: 600"
    >
      + <i class="fa fa-bed" aria-hidden="true"></i>
    </a>
    <a
      routerLink="notifications"
      style="position: relative; display: inline-block"
    >
      <i class="fa fa-bell" aria-hidden="true"></i>
      <span
        *ngIf="unreadCount > 0"
        style="
          position: absolute;
          top: -3px;
          right: -5px;
          background-color: red;
          color: white;
          border-radius: 50%;
          padding: 2px 6px;
          font-size: 10px;
        "
      >
        {{ unreadCount }}
      </span>
    </a>
    <a routerLink="requests">Requests</a>
    <a routerLink="account">Account</a>
    <a (click)="logout()">Log out</a>
  </ng-container>

  <ng-container *ngIf="!userType">
    <a routerLink="login">Sign in</a>
    <a routerLink="registration">Create an account</a>
  </ng-container>
</div>
