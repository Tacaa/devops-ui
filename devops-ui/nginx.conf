server {
  listen       80;
  server_name  localhost;

  root   /usr/share/nginx/html;
  index  index.html;

  # Serve files if they exist, otherwise fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # (optional) If you have API under /api proxied here, you could add:
  # location /api {
  #   proxy_pass http://your-api-host:8080;
  #   …other proxy settings…
  # }
}